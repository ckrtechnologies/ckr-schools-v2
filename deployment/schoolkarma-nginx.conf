# ==============================================================================
# SchoolKarma — Production Nginx Configuration (schoolkarma.com)
# Multi-Tenant School Operating System & Marketplace
#
# Architecture:
# - Main Domain: schoolkarma.com, www.schoolkarma.com
#   - /               -> Marketplace Portal (SPA)
#   - /superadmin/    -> Platform Super Admin Console (SPA)
#   - /spoc/          -> SPOC Marketing & Admissions Portal (SPA)
#   - /admin/         -> School Admin Operations Portal (SPA fallback)
#   - /api/           -> Express 5 Core API (Reverse Proxy to 127.0.0.1:5006)
#   - /socket.io/     -> WebSocket Realtime Engine (Reverse Proxy)
#   - /cdn/, /uploads/-> Uploaded Media & School Assets
#
# - Wildcard Subdomains: *.schoolkarma.com (e.g. vision.schoolkarma.com)
#   - /               -> School Tenant Admin Portal (SPA root)
#   - /spoc/          -> School SPOC Desk
#   - /admission/     -> Admissions Desk
#   - /finance/       -> Fees & Finance Desk
#   - /timetable/     -> Timetable & Proxies Desk
#   - /teacher-manager/ -> Teacher Manager Desk
#   - /tc/            -> Transfer Certificate Desk
#   - /academic-manager/-> Academic Exams Desk
#   - /api/           -> Express 5 API with Tenant Subdomain Header Forwarding
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirect (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name schoolkarma.com www.schoolkarma.com *.schoolkarma.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main Platform Domain: schoolkarma.com & www.schoolkarma.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name schoolkarma.com www.schoolkarma.com hq.schoolkarma.com;

    ssl_certificate /etc/letsencrypt/live/schoolkarma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolkarma.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Document Root for Marketplace SPA
    root /var/www/schoolkarma/marketplace;
    index index.html;

    client_max_body_size 50M;
    client_body_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # API Reverse Proxy
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant-Subdomain "marketplace";

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Realtime WebSocket Proxy
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 90s;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Media CDN
    location ^~ /cdn/ {
        alias /var/www/schoolkarma/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /uploads/ {
        alias /var/www/schoolkarma/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPOC Public Portal (/spoc/)
    location = /spoc {
        return 301 /spoc/;
    }
    location ^~ /spoc/ {
        alias /var/www/schoolkarma/spoc/;
        index index.html;
        try_files $uri $uri/ /spoc/index.html;
    }

    # Super Admin Portal (/superadmin/)
    location = /superadmin {
        return 301 /superadmin/;
    }
    location ^~ /superadmin/ {
        alias /var/www/schoolkarma/superadmin/;
        index index.html;
        try_files $uri $uri/ /superadmin/index.html;
    }

    # Admin Portal (/admin/)
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /var/www/schoolkarma/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Next.js Static Optimization Chunks
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Platform (Next.js Dynamic SSR & Static Pages on Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Assets Caching
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 3. Multi-Tenant Wildcard Domain: *.schoolkarma.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<tenant_subdomain>[a-zA-Z0-9-]+)\.schoolkarma\.com$;

    ssl_certificate /etc/letsencrypt/live/schoolkarma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolkarma.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Default root for tenant: School Admin SPA
    root /var/www/schoolkarma/tenant-admin;
    index index.html;

    client_max_body_size 50M;
    client_body_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # API with Subdomain Forwarding
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant-Subdomain $tenant_subdomain;

        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Realtime WebSockets with Subdomain Forwarding
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant-Subdomain $tenant_subdomain;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 90s;
        proxy_cache_bypass $http_upgrade;
    }

    # Operational Desks on Subdomain
    # 1. SPOC (/spoc/)
    location = /spoc { return 301 /spoc/; }
    location ^~ /spoc/ {
        alias /var/www/schoolkarma/spoc/;
        index index.html;
        try_files $uri $uri/ /spoc/index.html;
    }

    # 2. Admission Desk (/admission/)
    location = /admission { return 301 /admission/; }
    location ^~ /admission/ {
        alias /var/www/schoolkarma/admission/;
        index index.html;
        try_files $uri $uri/ /admission/index.html;
    }

    # 3. Finance Desk (/finance/)
    location = /finance { return 301 /finance/; }
    location ^~ /finance/ {
        alias /var/www/schoolkarma/finance/;
        index index.html;
        try_files $uri $uri/ /finance/index.html;
    }

    # 4. Timetable Desk (/timetable/)
    location = /timetable { return 301 /timetable/; }
    location ^~ /timetable/ {
        alias /var/www/schoolkarma/timetable/;
        index index.html;
        try_files $uri $uri/ /timetable/index.html;
    }

    # 5. Teacher Manager (/teacher-manager/)
    location = /teacher-manager { return 301 /teacher-manager/; }
    location = /teacher_manager { return 301 /teacher-manager/; }
    location ^~ /teacher_manager/ { rewrite ^/teacher_manager/(.*)$ /teacher-manager/$1 permanent; }
    location ^~ /teacher-manager/ {
        alias /var/www/schoolkarma/teacher_manager/;
        index index.html;
        try_files $uri $uri/ /teacher-manager/index.html;
    }

    # 6. TC Portal (/tc/)
    location = /tc { return 301 /tc/; }
    location ^~ /tc/ {
        alias /var/www/schoolkarma/tc/;
        index index.html;
        try_files $uri $uri/ /tc/index.html;
    }

    # 7. Academic Manager (/academic-manager/)
    location = /academic-manager { return 301 /academic-manager/; }
    location = /academic_manager { return 301 /academic-manager/; }
    location ^~ /academic_manager/ { rewrite ^/academic_manager/(.*)$ /academic-manager/$1 permanent; }
    location ^~ /academic-manager/ {
        alias /var/www/schoolkarma/academic_manager/;
        index index.html;
        try_files $uri $uri/ /academic-manager/index.html;
    }

    # Media CDN
    location ^~ /cdn/ {
        alias /var/www/schoolkarma/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /uploads/ {
        alias /var/www/schoolkarma/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # School Tenant Admin SPA Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}

